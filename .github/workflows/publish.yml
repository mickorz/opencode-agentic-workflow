# 打 v* tag 自动发布到 npm（npm Trusted Publishing / OIDC，无长期 token）
#
# 一次性前置配置（npmjs.com 包页 Settings → Trusted publishing）：
#   Organization or user: mickorz
#   Repository: opencode-agentic-workflow
#   Workflow filename: publish.yml（含扩展名，精确匹配）
#   Environment: 留空
#   Allowed actions: ☑ npm publish（2026-05-20 后新建的配置必须显式勾选！）
#   ⚠️ 48h 规则（2026-10-02 生效）：新建的 TP 配置必须在 48h 内完成一次成功
#   发布才算「已验证」；过期后仍显示在设置页但彻底失效，且普通编辑不重置
#   窗口——只能删除重建（重建后重新计时）。配置与运行身份不匹配、或配置
#   已过期时，发布同样报 E404（即使包存在）。
#
# ⚠️ 重跑旧 run 不会使用 main 上的新 YAML（GitHub Actions 重跑用原 commit
#   的工作流定义）——改过本文件后必须推新 tag 触发，rerun 无效。
#
# ⚠️ 全新包的首次发布（bootstrap，只做一次）：
#   npm Trusted Publishing 无法铸造包的第一个版本（npm/cli#8544）——
#   Trusted Publisher 只能配置在 npmjs 上已存在的包页。
#   因此 @mickorz/opencode-agentic-workflow 的 0.3.0 需手动首发一次：
#     1. 本地 npm login && npm publish        （dist/ 已构建，publishConfig 已带 public）
#     2. npmjs.com 包页 → Settings → Trusted Publisher → 按上面三项配置
#   之后所有版本走全自动：npm version patch → git push --follow-tags
#
# 发布流程（本地三步）：
#   1. 改代码并 commit
#   2. npm version patch（自动改版本号 + 提交 + 打 tag，如 v0.3.1）
#   3. git push --follow-tags（tag 推上去即触发本流水线）
#
# 兼容性硬要求：npm >= 11.5.1 才支持 OIDC 发布，node-version 必须用 24
# （Node 22 自带 npm < 11.5.1，OIDC 发布必失败）

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 短期凭证，npmjs Trusted Publishing 用
      packages: write   # GitHub Packages 镜像发布用（GITHUB_TOKEN 自动生成，无需配 secret）

    steps:
      - uses: actions/checkout@v6

      # OIDC 关键坑（坑H，2026-10-08 定案）：setup-node 只要配了 registry-url
      # 就会往 $RUNNER_TEMP/.npmrc 写 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 占位行（v7 也没修，actions/setup-node#1551）；npm 11 读到该行即认为
      # 「已配置凭证」，跳过 OIDC 交换，带空 Bearer 直接 PUT → npmjs 对未认证
      # 写返回 E404（伪装成包不存在）。
      # 判别法：失败日志若无 provenance 签名 / oidc 交换痕迹、PUT 后 300ms 内
      # 404，即此坑（v0.5.0 run 37733685262 日志实证：全程零 OIDC 痕迹）。
      # 故此处不配 registry-url（npmjs 是 npm 默认 registry，无需配置）。
      # （日志里的 npm notice "tokens that bypass 2FA..." 是普适 PSA，
      # 与走没走 OIDC 无关，勿据此误诊。）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false   # 防 npm 缓存投毒暴露 OIDC token（官方建议）

      # 防御性清理（版本无关）：若占位 _authToken 行因上游回归/缓存残留出现，
      # 删掉它让 npm 走 OIDC（azu/setup-npm-trusted-publish 的同款做法）
      - name: 清理 .npmrc 占位 _authToken（保 OIDC 路径）
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i.bak '/_authToken/d' "$npmrc" && rm -f "$npmrc.bak"
            echo "stripped _authToken from $npmrc"
          fi

      - run: npm ci

      # OIDC Trusted Publishing 前置条件可观测：Node >= 22.14、npm >= 11.5.1 才支持
      - name: 打印工具链版本
        run: |
          node --version
          npm --version

      # 防手滑：tag 与 package.json 版本不一致直接失败，不发错版本
      - name: 校验 tag 与 package.json 版本一致
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - run: npm run typecheck

      - run: npm test

      # dist/ 已 gitignore，publish 前必须显式构建（files: ["dist"]）
      - run: npm run build

      - name: 发布到 npm（OIDC，无需 token）
        run: npm publish --access public

      # ---------------- GitHub Packages 镜像（次要渠道，尽力而为） ----------------
      # 定位：npmjs 是用户正式安装渠道（免配置）；GitHub Packages 仅作仓库页展示镜像，
      # 其安装需 .npmrc 映射 + GitHub token，对最终用户无增益。
      # 故 continue-on-error：镜像失败不阻塞主发布（npmjs 已成功即可），失败在 Actions 摘要里可见。
      # 顺序固定 npmjs 先行：若镜像失败后重跑整个流水线，npm 步骤会因版本已存在而拦下，不会双发。
      - name: 切换 registry 到 GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@mickorz"

      - name: 发布到 GitHub Packages（GITHUB_TOKEN）
        continue-on-error: true
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
